name: Build bilingual reports

on:
  workflow_dispatch:
  push:
    paths:
      - 'report_en.tex'
      - 'report_zh.tex'
      - 'source_ledger.tex'
      - 'report_style.tex'
      - 'build.sh'
      - '.github/workflows/build-reports.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XeLaTeX and fonts
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-pictures texlive-lang-chinese texlive-fonts-recommended \
            fonts-ebgaramond fonts-ebgaramond-extra fonts-noto-core fonts-noto-cjk fonts-dejavu-core poppler-utils
          fc-cache -f

      - name: Build PDFs
        shell: bash
        run: |
          set +e
          chmod +x build.sh
          ./build.sh
          status=$?
          if [ "$status" -ne 0 ]; then
            echo '=== report_zh.log (tail) ==='
            tail -n 160 build/report_zh.log 2>/dev/null || true
            echo '=== report_en.log (tail) ==='
            tail -n 160 build/report_en.log 2>/dev/null || true
            exit "$status"
          fi
          test "$(pdfinfo ai_risk_agenda_en.pdf | awk '/^Pages:/{print $2}')" = "17"
          test "$(pdfinfo ai_risk_agenda_zh.pdf | awk '/^Pages:/{print $2}')" = "16"

      - name: Commit rebuilt PDFs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai_risk_agenda_en.pdf ai_risk_agenda_zh.pdf report_en.pdf report_zh.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Rebuild bilingual report PDFs'
            git push
          fi
